<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>החצר האחורית</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .hero {
      min-height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.7)),
        url('https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .hero h1 {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 22px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      background: #d4af37;
      color: #111;
      text-decoration: none;
      padding: 15px 28px;
      border-radius: 30px;
      font-weight: bold;
    }

    .section {
      padding: 70px 20px;
      text-align: center;
      max-width: 900px;
      margin: auto;
    }

    .section h2 {
      font-size: 36px;
      margin-bottom: 20px;
      color: #d4af37;
    }

    footer {
      background: #080808;
      text-align: center;
      padding: 25px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <section class="hero">
    <div>
      <h1>החצר האחורית</h1>
      <p>המקום שבו אירועים הופכים לזיכרונות</p>
      <a class="btn" href="#contact">לתיאום אירוע</a>
    </div>
  </section>

  <section class="section">
    <h2>על המקום</h2>
    <p>
      החצר האחורית היא מתחם אירועים באווירה מיוחדת,
      שמתאים לחתונות, בר ובת מצוות, ימי הולדת,
      אירועים פרטיים ואירועים עסקיים.
    </p>
  </section>

  <section class="section" id="contact">
    <h2>דברו איתנו</h2>
    <p>רוצים לשמוע פרטים ולבדוק תאריך פנוי?</p>
    <a class="btn" href="tel:0500000000">התקשרו עכשיו</a>
  </section>

  <footer>
    © 2026 החצר האחורית | כל הזכויות שמורות
  </footer>

</body>
</html>
